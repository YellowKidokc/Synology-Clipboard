services:
  cliphub:
    build: .
    container_name: cliphub
    restart: unless-stopped
    environment:
      CLIPHUB_DATA_DIR: /data
      CLIPHUB_API_KEY: ${CLIPHUB_API_KEY:-}
      CLIPHUB_HOST: 0.0.0.0
      CLIPHUB_PORT: 8080
    ports:
      - "${CLIPHUB_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true

